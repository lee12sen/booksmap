name: Measure Lead Time

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  measure:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Lead Time
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }
            );

            if (commits.length === 0) {
              core.setFailed('PR에 포함된 커밋을 찾을 수 없습니다.');
              return;
            }

            const commitTimes = commits
              .map((commit) => commit.commit.committer?.date ?? commit.commit.author?.date)
              .filter(Boolean)
              .map((date) => new Date(date));

            if (commitTimes.length === 0 || commitTimes.some((date) => Number.isNaN(date.getTime()))) {
              core.setFailed('커밋 시간을 확인할 수 없습니다.');
              return;
            }

            const firstCommitTime = new Date(Math.min(...commitTimes.map((date) => date.getTime())));
            const mergeTime = new Date(pullRequest.merged_at);
            const leadTimeMs = mergeTime.getTime() - firstCommitTime.getTime();

            if (Number.isNaN(mergeTime.getTime()) || leadTimeMs < 0) {
              core.setFailed('Lead Time을 계산할 수 없습니다.');
              return;
            }

            const totalMinutes = Math.floor(leadTimeMs / 60000);
            const days = Math.floor(totalMinutes / 1440);
            const hours = Math.floor((totalMinutes % 1440) / 60);
            const minutes = totalMinutes % 60;
            const formattedLeadTime = [
              days > 0 ? `${days}일` : '',
              hours > 0 ? `${hours}시간` : '',
              `${minutes}분`,
            ].filter(Boolean).join(' ');

            const formatDate = (date) =>
              date.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });

            await core.summary
              .addHeading('Lead Time')
              .addTable([
                [{ data: '항목', header: true }, { data: '값', header: true }],
                ['PR', `#${pullRequest.number}`],
                ['첫 커밋 시간', `${formatDate(firstCommitTime)} (KST)`],
                ['PR 병합 시간', `${formatDate(mergeTime)} (KST)`],
                ['Lead Time', formattedLeadTime],
              ])
              .write();

            core.info(`PR #${pullRequest.number} Lead Time: ${formattedLeadTime}`);

name: Measure Deployment Frequency

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  deployments: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Count weekly Production deployments
        uses: actions/github-script@v7
        with:
          script: |
            const end = new Date();
            const start = new Date(end.getTime() - 7 * 24 * 60 * 60 * 1000);
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'Production',
                since: start.toISOString(),
                per_page: 100,
              }
            );

            const successfulDeploymentIds = new Set();

            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                }
              );
              const latestStatus = statuses[0];

              if (latestStatus?.state === 'success') {
                successfulDeploymentIds.add(deployment.id);
              }
            }

            const count = successfulDeploymentIds.size;
            const formatDate = (date) =>
              date.toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' });
            const period = `${formatDate(start)} ~ ${formatDate(end)}`;

            await core.summary
              .addHeading('Deployment Frequency')
              .addTable([
                [{ data: '항목', header: true }, { data: '결과', header: true }],
                ['측정 기간', period],
                ['Production 배포 횟수', `${count}회`],
                ['배포 빈도', `주 ${count}회`],
              ])
              .write();

            core.info(`측정 기간: ${period}`);
            core.info(`Production 배포 횟수: ${count}회`);
            core.info(`배포 빈도: 주 ${count}회`);

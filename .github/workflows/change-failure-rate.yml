name: Measure Change Failure Rate

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  deployments: read
  issues: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate change failure rate
        uses: actions/github-script@v7
        with:
          script: |
            const end = new Date();
            const start = new Date(end.getTime() - 7 * 24 * 60 * 60 * 1000);
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'Production',
                since: start.toISOString(),
                per_page: 100,
              }
            );

            const successfulDeployments = [];
            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                }
              );
              if (statuses[0]?.state === 'success') {
                successfulDeployments.push(deployment);
              }
            }

            const incidents = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                since: start.toISOString(),
                per_page: 100,
              }
            );
            const incidentStarts = incidents
              .filter((issue) => issue.title === 'Incident: Production health check failed')
              .map((issue) => {
                const startedAt = issue.body?.match(/Started at: (.+)/)?.[1];
                return startedAt ? Date.parse(startedAt) : NaN;
              })
              .filter((timestamp) => Number.isFinite(timestamp));

            const failedDeploymentIds = new Set();
            for (const incidentStart of incidentStarts) {
              const previousDeployment = successfulDeployments
                .filter((deployment) => Date.parse(deployment.created_at) <= incidentStart)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (previousDeployment) {
                failedDeploymentIds.add(previousDeployment.id);
              }
            }

            const total = new Set(successfulDeployments.map((deployment) => deployment.id)).size;
            const failed = failedDeploymentIds.size;
            const rate = total === 0 ? 0 : ((failed / total) * 100).toFixed(1);
            const period = `${start.toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' })} ~ ${end.toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' })}`;

            await core.summary
              .addHeading('Change Failure Rate')
              .addTable([
                [{ data: '항목', header: true }, { data: '결과', header: true }],
                ['측정 기간', period],
                ['전체 Production 배포', `${total}회`],
                ['장애를 일으킨 배포', `${failed}회`],
                ['변경 실패율', `${rate}%`],
              ])
              .write();

            core.info(`변경 실패율: ${rate}%`);
